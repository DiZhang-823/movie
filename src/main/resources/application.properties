spring.application.name=movie
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/movie_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

tmdb.base-url=https://api.themoviedb.org/3
tmdb.bearer-token-v3=${TMDB_BEARER_TOKEN_V3:}
tmdb.bearer-token-v4=${TMDB_BEARER_TOKEN_V4:}
tmdb.language=zh-CN

movie.tmdb.auto-import.enabled=${MOVIE_TMDB_AUTO_IMPORT_ENABLED:false}
movie.tmdb.auto-import.start-id=${MOVIE_TMDB_AUTO_IMPORT_START_ID:224}
movie.tmdb.auto-import.initial-delay-ms=${MOVIE_TMDB_AUTO_IMPORT_INITIAL_DELAY_MS:3000}
movie.tmdb.auto-import.delay-ms=${MOVIE_TMDB_AUTO_IMPORT_DELAY_MS:300000}

imdb.ratings.url=${IMDB_RATINGS_URL:https://datasets.imdbws.com/title.ratings.tsv.gz}

app.fronted.url=${APP_FRONTEND_URL:http://localhost:5173}

jwt.secret=${JWT_SECRET:ZmY2N2Y4YzQ2M2M2N2QzYjA1ZjQ0ZTUyY2E4YjI5N2YzYzM1MGM0YzA4Y2E3YzM4M2M4M2Q5ZDUzZTFmYQ==}
#86400000-24 hours
jwt.expiration=86400000

resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:${MAIL_FROM:}}
resend.timeout-ms=${RESEND_TIMEOUT_MS:10000}
